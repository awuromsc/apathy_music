name: Build APATHY Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (1, 2, 3...)'
        required: true
        default: '1'
      version_name:
        description: 'Version Name (1.0.0, 1.1.0...)'
        required: true
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack APATHY Android project
        run: |
          ZIP_FILE=$(ls apathy_android_apk*.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: apathy_android_apk_v1.zip not found in repo root!"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PASS="${KEYSTORE_PASSWORD:-apathy2026}"
          K_ALIAS="${KEY_ALIAS:-apathy}"
          K_PASS="${KEY_PASSWORD:-apathy2026}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > project/apathy-release.jks
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair -v \
              -keystore project/apathy-release.jks \
              -storepass "$KS_PASS" \
              -alias "$K_ALIAS" \
              -keypass "$K_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=APATHY, OU=Music, O=APATHY, L=City, S=State, C=RU"
            mkdir -p keystore_export
            cp project/apathy-release.jks keystore_export/apathy-release.jks
            base64 -w 0 project/apathy-release.jks > keystore_export/KEYSTORE_BASE64.txt
            echo "generated=true" >> $GITHUB_OUTPUT
          fi

      - name: Build signed Release APK
        env:
          APATHY_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          APATHY_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          KEYSTORE_PATH: ${{ github.workspace }}/project/apathy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'apathy2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'apathy' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'apathy2026' }}
        run: |
          cd project
          gradle assembleRelease --no-daemon
          cd ..
          mkdir -p dist
          cp project/app/build/outputs/apk/release/app-release.apk "dist/APATHY-v${APATHY_VERSION_NAME}-c${APATHY_VERSION_CODE}.apk"
          ls -lh dist/

      - name: Upload APATHY APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APATHY-APK-v${{ github.event.inputs.version_name || '1.0.0' }}
          path: dist/*.apk
          retention-days: 90

      - name: Upload generated Keystore
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-KEYSTORE-FOR-UPDATES
          path: keystore_export/
          retention-days: 30
